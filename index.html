
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blutdruck Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{font-family:Arial;margin:0;padding:20px;background:#f5f5f5}
.card{background:#fff;padding:16px;margin-bottom:12px;border-radius:12px}
input,button{width:100%;padding:10px;margin-top:8px}
button{background:#000;color:#fff;border:0;border-radius:8px}
</style>
</head>
<body>

<h2>Blutdruck Tracker</h2>

<div class="card">
<input id="sys" type="number" placeholder="SYS"/>
<input id="dia" type="number" placeholder="DIA"/>
<input id="pulse" type="number" placeholder="Puls"/>
<button onclick="save()">Speichern</button>
</div>

<div class="card">
<button onclick="exportCSV()">CSV Export</button>
<button onclick="exportPDF()">PDF Export</button>
</div>

<div class="card">
<table width="100%">
<thead><tr><th>Datum</th><th>SYS</th><th>DIA</th><th>Puls</th></tr></thead>
<tbody id="t"></tbody>
</table>
</div>

<canvas id="c"></canvas>

<script src="app.js"></script>
</body>
</html>
